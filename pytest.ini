[pytest]
; pytest-asyncio: run async tests without explicit @pytest.mark.asyncio markers
asyncio_mode = auto
; All async tests share one session-scoped event loop: aiosqlite connections
; are created on this loop, so the session-end close fixture can close them
; on the same loop (per-test loops would leave open connections behind and
; the aiosqlite background work keeps the process alive after the suite).
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
testpaths = tests
